# IPAtlas continuous integration.
# Runs on every push and pull request to main/develop:
#   install -> lint (flake8) -> unit tests + coverage (pytest) -> smoke test (app boots).
# Tests mock all HTTP, so no API keys or secrets are needed.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: # allows a manual "Run workflow" button (handy for the demo)

permissions:
  contents: read

# Cancel an older run of the same branch/PR when a newer commit is pushed.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
        include:
          # The team develops on Windows, so check one Windows build too.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (flake8)
        # max-line-length and excludes come from setup.cfg
        run: flake8 app tests

      - name: Unit tests + coverage (pytest)
        run: >
          pytest
          --junitxml=report.xml
          --cov=app
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Smoke test (app starts and /api/health answers)
        if: runner.os == 'Linux'
        run: |
          python run.py > server.log 2>&1 &
          curl --silent --show-error --fail \
               --retry 10 --retry-delay 1 --retry-connrefused \
               http://127.0.0.1:5000/api/health | tee health.json
          grep -q '"status": *"ok"' health.json || (cat server.log; exit 1)

      - name: Coverage summary
        if: always() && runner.os == 'Linux'
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          if os.path.exists("coverage.xml"):
              rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
              print(f"### Coverage (Python ${{ matrix.python-version }}): {rate:.1f}%")
          else:
              print("### Coverage: not generated (tests did not run)")
          EOF

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            report.xml
            coverage.xml
          if-no-files-found: ignore

  # Single, stable check name to require in branch protection on main.
  ci-passed:
    name: ci-passed
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: All test jobs succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test jobs result: ${{ needs.test.result }}"
            exit 1
          fi
